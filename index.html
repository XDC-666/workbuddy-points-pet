<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorkBuddy 积分桌宠</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent; overflow: hidden;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  /* ---- 宠物整体 ---- */
  #pet {
    position: relative;
    width: 220px; margin: 0 auto;
    padding-top: 76px;
    cursor: grab;
    animation: hover 3.6s ease-in-out infinite;
    transform-origin: bottom center;
  }
  #pet:active { cursor: grabbing; }
  @keyframes hover {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    45% { transform: translateY(-10px) rotate(-1deg); }
    55% { transform: translateY(-10px) rotate(1deg); }
    75% { transform: translateY(0) rotate(0deg); }
  }
  #pet.tap { animation: tapWiggle .5s ease; }
  @keyframes tapWiggle {
    0%, 100% { transform: scale(1) rotate(0); }
    20% { transform: scale(1.08, .9) rotate(-4deg); }
    45% { transform: scale(.94, 1.06) rotate(4deg); }
    70% { transform: scale(1.03, .97) rotate(-2deg); }
  }

  /* ---- 对话气泡（点击/状态提示） ---- */
  #chatBubble {
    position: absolute;
    left: 50%; bottom: 100%;
    transform: translateX(-50%) translateY(-6px);
    margin-bottom: 2px;
    max-width: 210px;
    padding: 7px 11px;
    border-radius: 14px;
    font-size: 12px; line-height: 1.45;
    color: #f0f4f8;
    text-align: center;
    white-space: pre-wrap;
    background: rgba(18, 22, 34, .82);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 10px 26px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    opacity: 0; visibility: hidden;
    transition: opacity .28s, transform .28s, visibility .28s;
    pointer-events: none;
    z-index: 20;
    max-width: 200px;
  }
  #chatBubble.show {
    opacity: 1; visibility: visible;
    transform: translateX(-50%) translateY(-12px);
  }
  #chatBubble::after {
    content: '';
    position: absolute;
    top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: rgba(18, 22, 34, .82);
  }
  #chatBubble .caret { opacity: .8; }

  /* ---- 喂食爱心 ---- */
  #hearts {
    position: absolute; left: 0; right: 0; bottom: 100%;
    height: 60px; pointer-events: none; z-index: 15;
  }
  .heart {
    position: absolute; bottom: 0; opacity: 0;
    animation: floatUp 1.5s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(.5); }
    22% { opacity: 1; transform: translateY(-10px) scale(1.05); }
    100% { opacity: 0; transform: translateY(-54px) scale(.75); }
  }

  /* ---- 角色容器 ---- */
  #char {
    position: relative;
    width: 160px; height: 150px;
    margin: 0 auto;
    filter: drop-shadow(0 18px 28px rgba(0,0,0,.45));
    transition: filter .35s;
  }
  #char svg { display: block; width: 100%; height: 100%; }

  /* ---- 表情切换 ---- */
  .eyes { display: none; }
  body.st-idle #eyesNormal,
  body.st-low #eyesNormal { display: block; }
  body.st-thinking #eyesThink { display: block; }
  body.st-working #eyesWork { display: block; }
  body.st-success #eyesHappy { display: block; }
  body.st-error #eyesError { display: block; }
  body.st-tap #eyesTap { display: block; }
  body.st-eat #eyesEat { display: block; }

  /* 嘴巴：成功时咧嘴笑，思考时抿嘴 */
  #mouth, #mouthHappy { transition: opacity .25s; }
  body.st-success #mouth { opacity: 0; }
  body.st-success #mouthHappy { opacity: 1; }
  body.st-thinking #mouth { opacity: .45; }
  body.st-working #mouth { opacity: .7; }

  .eye-glow { animation: eyePulse 2.4s ease-in-out infinite; }
  @keyframes eyePulse { 0%, 90%, 100% { opacity: .85; } 45% { opacity: 1; } }

  /* 眨眼由 renderer.js 随机触发，避免与眼睛跟随的 transform 冲突 */
  #eyesNormal { transform-origin: 110px 92px; }
  .eyes { transform-box: fill-box; transform-origin: center; }

  /* 面罩反光扫过 */
  .visor-sheen { animation: sheen 4.5s ease-in-out infinite; }
  @keyframes sheen {
    0%, 80%, 100% { transform: translateX(-40px); opacity: 0; }
    35% { transform: translateX(40px); opacity: .55; }
  }

  /* ---- 状态动画 ---- */
  /* 思考：头部微晃 + 灯快闪 */
  body.st-thinking #char { animation: tilt 1.6s ease-in-out infinite; }
  @keyframes tilt {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-4deg); }
    75% { transform: rotate(4deg); }
  }
  /* 工作：忙碌抖动 */
  body.st-working #char { animation: busy .55s ease-in-out infinite; }
  @keyframes busy {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); }
    75% { transform: translate(-1px, -1px); }
  }
  /* 成功：开心弹跳 */
  body.st-success #char { animation: bounce .7s ease; }
  @keyframes bounce {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-18px) scale(1.05, .95); }
    55% { transform: translateY(0) scale(.95, 1.05); }
    75% { transform: translateY(-7px) scale(1); }
    100% { transform: translateY(0) scale(1); }
  }
  /* 错误：摇头 */
  body.st-error #char { animation: shake .6s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-6px); }
    35% { transform: translateX(6px); }
    55% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  /* 进食：咀嚼 */
  body.st-eat #char { animation: chew .38s ease-in-out infinite; }
  @keyframes chew {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50% { transform: translateY(3px) scaleY(.96); }
  }
  /* 低余额：颤抖 */
  body.st-low #pet { animation: hover 3.6s ease-in-out infinite, shiver 2.2s ease-in-out infinite; }
  @keyframes shiver {
    0%, 100% { transform: translateX(0); }
    10% { transform: translateX(-2px); }
    20% { transform: translateX(2px); }
    30% { transform: translateX(-1px); }
    40% { transform: translateX(1px); }
    50% { transform: translateX(0); }
  }
  body.st-low #char { filter: drop-shadow(0 18px 28px rgba(0,0,0,.45)) saturate(.65) brightness(.88); }
  #tear { opacity: 0; transition: opacity .4s; }
  body.st-low #tear { opacity: .9; }

  /* 头顶指示灯颜色随状态 */
  #topLight { fill: #2bd4ff; transition: fill .3s; }
  body.st-thinking #topLight, body.st-working #topLight { fill: #ffb84d; }
  body.st-success #topLight { fill: #4ade80; }
  body.st-error #topLight { fill: #ff6b6b; }
  body.st-low #topLight { fill: #ff9b5a; }
  body.st-tap #topLight { fill: #b78cff; }
  body.st-eat #topLight { fill: #ff8fb1; }

  /* ---- 积分气泡（玻璃拟态） ---- */
  #bubble {
    position: relative;
    margin: -4px auto 0;
    padding: 10px 14px;
    width: fit-content; min-width: 150px; max-width: 220px;
    border-radius: 16px;
    color: #f0f4f8;
    text-align: center;
    background: rgba(18, 22, 34, .68);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 12px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
  }
  #bubble::before {
    content: '';
    position: absolute; inset: 0; border-radius: 16px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.03) 60%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  #label {
    font-size: 11px;
    letter-spacing: .5px;
    color: rgba(200,214,235,.75);
  }
  #balance {
    font-size: 32px; font-weight: 800;
    line-height: 1.05;
    margin: 2px 0;
    background: linear-gradient(180deg, #fff 0%, #b8d4ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 18px rgba(79,166,255,.25);
  }
  #balance.pop { animation: pop .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  body.st-low #balance {
    background: linear-gradient(180deg, #ffd6d6 0%, #ff8a8a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 18px rgba(255,90,90,.35);
  }
  #status {
    font-size: 11px;
    color: rgba(170,190,220,.65);
    min-height: 14px;
  }
  #status.err { color: #ff9b9b; }
  #status.warn { color: #ffd479; }

  /* 闲置半透明 */
  body.idle #pet { opacity: .55; transition: opacity .35s; }
  body.idle #bubble { opacity: .6; }
  body.idle:hover #pet, body.idle:hover #bubble { opacity: 1; }

  /* ---- 设置面板 ---- */
  #settings {
    position: fixed; inset: 0;
    background: rgba(8,12,22,.82);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  #settings.hidden { display: none; }
  #form {
    width: 300px; max-height: 92%; overflow: auto;
    background: rgba(24,30,46,.92);
    color: #e8eef7;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px;
    padding: 18px;
    font-size: 13px;
    box-shadow: 0 20px 50px rgba(0,0,0,.55);
  }
  #form h3 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
  #form label { display: block; margin: 10px 0 4px; color: #aab6cc; }
  #form input[type=text], #form input[type=number], #form select, #form textarea {
    width: 100%; padding: 7px 10px;
    background: rgba(12,16,26,.7);
    color: #e8eef7;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    font-size: 13px; font-family: inherit;
    outline: none;
  }
  #form input:focus, #form select:focus, #form textarea:focus {
    border-color: rgba(79,166,255,.6);
    box-shadow: 0 0 0 2px rgba(79,166,255,.15);
  }
  #form textarea { height: 64px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; padding: 9px; border: none; border-radius: 10px;
    cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600;
    transition: transform .1s, opacity .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary {
    background: linear-gradient(135deg, #2b8cff, #185FA5);
    color: #fff;
    box-shadow: 0 4px 14px rgba(24,95,165,.35);
  }
  .btn.ghost {
    background: rgba(255,255,255,.08);
    color: #c8d4e8;
  }
  .hint { font-size: 11px; color: #74829c; margin-top: 3px; }
</style>
</head>
<body>
  <div id="pet">
    <!-- 对话气泡（点击/状态提示） -->
    <div id="chatBubble"><span class="chat-text"></span></div>
    <!-- 喂食时飘出的爱心 -->
    <div id="hearts"></div>

    <!-- 机器人角色 -->
    <div id="char">
      <svg viewBox="0 0 220 200" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="helmGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="40%" stop-color="#f2f5fa" />
            <stop offset="75%" stop-color="#d8dfe8" />
            <stop offset="100%" stop-color="#b0bcc9" />
          </radialGradient>
          <linearGradient id="helmRim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="50%" stop-color="#e3e8ef" />
            <stop offset="100%" stop-color="#b8c3d1" />
          </linearGradient>
          <radialGradient id="visorGrad" cx="50%" cy="25%" r="80%">
            <stop offset="0%" stop-color="#2b3a52" />
            <stop offset="45%" stop-color="#111827" />
            <stop offset="100%" stop-color="#05080f" />
          </radialGradient>
          <linearGradient id="eyeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8ff6ff" />
            <stop offset="100%" stop-color="#2bd4ff" />
          </linearGradient>
          <filter id="eyeGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
            <feOffset dx="0" dy="6" result="offsetblur" />
            <feComponentTransfer><feFuncA type="linear" slope=".35" /></feComponentTransfer>
            <feMerge><feMergeNode in="offsetblur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <clipPath id="visorClip"><ellipse cx="110" cy="88" rx="56" ry="44" /></clipPath>
        </defs>

        <!-- 机身/下巴 -->
        <path d="M70 118 Q70 162 110 168 Q150 162 150 118" fill="url(#helmGrad)" filter="url(#softShadow)" />
        <path d="M80 122 Q80 152 110 158 Q140 152 140 122" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2" />

        <!-- 手臂（趴在桌边） -->
        <ellipse cx="46" cy="138" rx="18" ry="14" fill="#d8dfe8" filter="url(#softShadow)" />
        <ellipse cx="174" cy="138" rx="18" ry="14" fill="#d8dfe8" filter="url(#softShadow)" />
        <ellipse cx="42" cy="142" rx="10" ry="8" fill="#b0bcc9" />
        <ellipse cx="178" cy="142" rx="10" ry="8" fill="#b0bcc9" />

        <!-- 头盔主体 -->
        <circle cx="110" cy="88" r="74" fill="url(#helmGrad)" filter="url(#softShadow)" />
        <circle cx="110" cy="88" r="70" fill="none" stroke="url(#helmRim)" stroke-width="4" />

        <!-- 面罩 -->
        <ellipse cx="110" cy="88" rx="60" ry="48" fill="url(#visorGrad)" stroke="#0b111c" stroke-width="3" />
        <g clip-path="url(#visorClip)">
          <rect x="40" y="40" width="40" height="100" fill="url(#sheenGrad)" class="visor-sheen" />
          <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="rgba(255,255,255,0)" />
            <stop offset="50%" stop-color="rgba(255,255,255,.55)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
          </linearGradient>
        </g>

        <!-- ===== 表情：待机 ===== -->
        <g id="eyesNormal" class="eyes eye-glow" filter="url(#eyeGlow)">
          <ellipse cx="88" cy="92" rx="14" ry="9" fill="url(#eyeGrad)" />
          <ellipse cx="132" cy="92" rx="14" ry="9" fill="url(#eyeGrad)" />
          <circle cx="92" cy="89" r="3" fill="#fff" opacity=".85" />
          <circle cx="136" cy="89" r="3" fill="#fff" opacity=".85" />
        </g>

        <!-- ===== 表情：思考 ===== -->
        <g id="eyesThink" class="eyes eye-glow" filter="url(#eyeGlow)">
          <ellipse cx="88" cy="89" rx="12" ry="5" fill="url(#eyeGrad)" />
          <ellipse cx="132" cy="89" rx="12" ry="5" fill="url(#eyeGrad)" />
          <path d="M74 78 L101 84" stroke="#8ff6ff" stroke-width="3" stroke-linecap="round" opacity=".75" fill="none" />
          <path d="M146 78 L119 84" stroke="#8ff6ff" stroke-width="3" stroke-linecap="round" opacity=".75" fill="none" />
        </g>

        <!-- ===== 表情：工作中 ===== -->
        <g id="eyesWork" class="eyes eye-glow" filter="url(#eyeGlow)">
          <ellipse cx="88" cy="94" rx="11" ry="10" fill="url(#eyeGrad)" />
          <ellipse cx="132" cy="94" rx="11" ry="10" fill="url(#eyeGrad)" />
          <circle cx="90" cy="91" r="2.5" fill="#fff" opacity=".9" />
          <circle cx="134" cy="91" r="2.5" fill="#fff" opacity=".9" />
          <path d="M76 76 L100 82" stroke="#7d90aa" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M144 76 L120 82" stroke="#7d90aa" stroke-width="3" stroke-linecap="round" fill="none" />
        </g>

        <!-- ===== 表情：成功（开心弯月眼） ===== -->
        <g id="eyesHappy" class="eyes eye-glow" filter="url(#eyeGlow)">
          <path d="M75 97 Q88 81 101 97" stroke="url(#eyeGrad)" stroke-width="7" fill="none" stroke-linecap="round" />
          <path d="M119 97 Q132 81 145 97" stroke="url(#eyeGrad)" stroke-width="7" fill="none" stroke-linecap="round" />
        </g>

        <!-- ===== 表情：错误 ===== -->
        <g id="eyesError" class="eyes eye-glow" filter="url(#eyeGlow)">
          <path d="M80 87 L96 97 M96 87 L80 97" stroke="#ff7a7a" stroke-width="5" stroke-linecap="round" fill="none" />
          <path d="M124 87 L140 97 M140 87 L124 97" stroke="#ff7a7a" stroke-width="5" stroke-linecap="round" fill="none" />
        </g>

        <!-- ===== 表情：被戳（眨眼惊讶） ===== -->
        <g id="eyesTap" class="eyes eye-glow" filter="url(#eyeGlow)">
          <circle cx="88" cy="92" r="11" fill="url(#eyeGrad)" />
          <circle cx="132" cy="92" r="11" fill="url(#eyeGrad)" />
          <circle cx="91" cy="88" r="3.5" fill="#fff" opacity=".9" />
          <circle cx="135" cy="88" r="3.5" fill="#fff" opacity=".9" />
        </g>

        <!-- ===== 表情：进食（满足眯眼） ===== -->
        <g id="eyesEat" class="eyes eye-glow" filter="url(#eyeGlow)">
          <path d="M76 96 Q88 85 100 96" stroke="url(#eyeGrad)" stroke-width="6" fill="none" stroke-linecap="round" />
          <path d="M120 96 Q132 85 144 96" stroke="url(#eyeGrad)" stroke-width="6" fill="none" stroke-linecap="round" />
        </g>

        <!-- 小嘴巴 -->
        <path id="mouth" d="M104 112 Q110 117 116 112" stroke="#5a6d87" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <!-- 开心嘴巴 -->
        <path id="mouthHappy" d="M100 110 Q110 121 120 110" stroke="#5a6d87" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0" />
        <!-- 头顶指示灯 -->
        <circle id="topLight" cx="110" cy="32" r="5" filter="url(#eyeGlow)" opacity=".9">
          <animate attributeName="opacity" values=".6;1;.6" dur="2s" repeatCount="indefinite" />
        </circle>

        <!-- 低余额眼泪 -->
        <circle id="tear" cx="76" cy="104" r="5" fill="#7FBDFF" opacity=".85" />
      </svg>
    </div>

    <!-- 积分气泡 -->
    <div id="bubble">
      <div id="label">WorkBuddy 积分</div>
      <div id="balance">--</div>
      <div id="status">加载中…</div>
    </div>
  </div>

  <!-- 设置面板 -->
  <div id="settings" class="hidden">
    <form id="form">
      <h3>桌宠设置</h3>

      <label>数据源</label>
      <select name="source">
        <option value="file">本地文件 / 手动录入</option>
        <option value="http">HTTP 余额接口</option>
      </select>

      <div id="fileCfg">
        <label>显示名称</label>
        <input type="text" name="label" />
        <label>当前积分（手动模式回退值）</label>
        <input type="number" name="balance" step="any" />
        <p class="hint">HTTP 模式下此项由接口返回，无需填写。</p>

        <hr style="border:none;border-top:1px solid rgba(255,255,255,.1);margin:14px 0" />
        <label>钩子自动上报（安装钩子后生效）</label>
        <label>我的初始积分</label>
        <input type="number" name="initialBalance" step="any" />
        <label>每次交互消耗</label>
        <input type="number" name="cost" step="any" />
        <label class="row"><input type="checkbox" name="autoDeduct" /> 启用自动扣减</label>
        <p class="hint">需先运行 <code>npm run install-hook</code> 安装 WorkBuddy 钩子。每次对话/工具调用自动扣减，剩余积分实时显示。想重置余额：删掉 ~/.workbuddy-points-pet/balance.json 后再保存即可。</p>
      </div>

      <div id="httpCfg" style="display:none">
        <label>余额接口 URL</label>
        <input type="text" name="url" placeholder="https://api.deepseek.com/user/balance" />
        <label>Authorization 头</label>
        <input type="text" name="auth" placeholder="Bearer YOUR_API_KEY" />
        <label>余额字段路径 (jsonPath)</label>
        <input type="text" name="jsonPath" placeholder="balance_infos[0].total_balance" />
        <p class="hint">支持点路径与数组索引，如 a.b[0].c</p>
      </div>

      <label>刷新间隔（秒）</label>
      <input type="number" name="interval" min="5" value="30" />

      <label>低余额提醒阈值</label>
      <input type="number" name="threshold" step="any" value="5" />

      <label class="row"><input type="checkbox" name="idleFade" /> 闲置时半透明</label>

      <label class="row"><input type="checkbox" name="autoPlay" /> 自动模拟工作状态</label>
      <label class="row"><input type="checkbox" name="sound" /> 开启音效</label>

      <label>点击桌宠时说的话（每行一条）</label>
      <textarea name="tapLines"></textarea>

      <label>待机语录（每行一条）</label>
      <textarea name="quotes"></textarea>

      <div class="actions">
        <button type="button" class="btn ghost" id="cancel">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
